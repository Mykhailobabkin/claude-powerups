# Generated by repo-standard.
name: Documentation standard
on:
  pull_request:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  docs-standard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check documentation and committed files
        run: python3 .repo-standard/check.py .
      - name: Check pull request changelog coverage
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 .repo-standard/check.py . --base "$BASE_SHA"
