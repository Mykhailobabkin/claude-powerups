# Generated from shared agent rules; local commits refresh this file automatically.
name: Shared agent rules
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  docs-standard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check shared rules
        env:
          AGENT_RULES_BASE: ${{ github.event.pull_request.base.sha }}
        run: python3 .github/agent-check.py ci
